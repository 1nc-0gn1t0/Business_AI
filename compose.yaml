name: business-ai

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_ai}
      POSTGRES_USER: ${POSTGRES_USER:-business_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: &database-environment
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-business_ai}
      PGUSER: ${POSTGRES_USER:-business_ai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    environment:
      <<: *database-environment
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      DATA_DEMO_ENABLED: ${DATA_DEMO_ENABLED:-false}
      BA_API_LIMITS_JSON: ${BA_API_LIMITS_JSON:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-tests:
    profiles: [test]
    build:
      context: ./apps/api
      target: integration-tests
    environment:
      <<: *database-environment
      BA_RUN_DB_TESTS: "1"
      LLM_PROVIDER: stub
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
