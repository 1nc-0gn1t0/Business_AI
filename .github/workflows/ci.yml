name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API dependencies from lock
        run: uv sync --locked --project apps/api
      - name: Install pinned age for real encryption tests (temporary synthetic keys only)
        shell: pwsh
        run: |
          $ageRoot = ./scripts/install_age.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'business-ai-age')
          $binary = if ($IsWindows) { 'age.exe' } else { 'age' }
          "BA_AGE_BINARY=$(Join-Path $ageRoot $binary)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install web dependencies from lock
        run: npm --prefix apps/web ci
      - name: Operator backup tooling checks
        run: |
          uv run --locked --project apps/api ruff check scripts/backup_postgres.py scripts/encrypted_backup.py scripts/recovery_rehearsal.py scripts/recovery_negative_checks.py scripts/check_secret_scanner.py scripts/inventory_dependencies.py scripts/image_security.py scripts/restore_container_upgrade.py
          uv run --locked --project apps/api ruff format --check scripts/backup_postgres.py scripts/encrypted_backup.py scripts/recovery_rehearsal.py scripts/recovery_negative_checks.py scripts/check_secret_scanner.py scripts/inventory_dependencies.py scripts/image_security.py scripts/restore_container_upgrade.py
      - name: Check Docker requirements match the lock
        working-directory: apps/api
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Lint, formatting, type checks and API tests
        run: uv tool run --from prek==0.5.4 prek run --all-files
      - name: Build web
        run: npm --prefix apps/web run build
      - name: Extended pairwise and property checks (fixed seeds; no LLM)
        run: uv run --locked --project apps/api pytest apps/api/tests -m extended --hypothesis-show-statistics
      - name: Install Chromium for mocked browser workflow
        if: runner.os == 'Linux'
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Browser workflow (explicit mock adapter; no GPU or model)
        if: runner.os == 'Linux'
        run: npm --prefix apps/web run test:e2e

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: business-ai-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and wait for healthy services
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check API, PostGIS and web
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Reject unverified old PGDATA without modifying it
        shell: pwsh
        run: ./scripts/check_postgis_guard.ps1 -Image business-ai-postgis-hardened
      - name: Test migrations and database constraints in isolated databases
        run: docker compose --profile test run --build --rm db-tests
      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100 api
      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans
