[project]
name = "business-ai-api"
version = "0.1.0"
description = "Business AI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "reportlab>=4.4,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2",
    "hypothesis>=6,<7",
    "mypy>=1.15,<2",
    "pypdf>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["extended: BA-016 pairwise and property-based validation (no network or LLM)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
