[project]
name = "business-ai-api"
version = "0.1.0"
description = "Business AI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
