server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        # Queue <=30s + model <=180s, with headroom for short DB phases.
        # Browser deadline is 250s so the proxy can return a controlled error first.
        proxy_read_timeout 240s;
    }
}
